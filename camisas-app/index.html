<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camisas BR">
<link rel="manifest" href="manifest.json">
<title>Camisas BR</title>
<style>
:root {
  --bg: #0a0a0a; --bg2: #141414; --bg3: #1e1e1e; --bg4: #282828;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --text: #f0f0f0; --text2: #888; --text3: #444;
  --accent: #e8ff57; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
  --r: 12px; --r-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}

/* AUTH */
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
#authScreen h1{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
#authScreen p{font-size:13px;color:var(--text2);margin-bottom:2rem;text-align:center}
.auth-card{width:100%;max-width:340px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);padding:1.5rem}
.auth-tabs{display:flex;gap:0;margin-bottom:1.25rem;background:var(--bg3);border-radius:var(--r-sm);padding:3px}
.auth-tab{flex:1;text-align:center;padding:7px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--text2)}
.auth-tab.active{background:var(--bg);color:var(--text)}
.auth-field{margin-bottom:10px}
.auth-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.auth-field input{width:100%;background:var(--bg3);border:0.5px solid var(--border2);color:var(--text);font-size:14px;padding:10px 12px;border-radius:var(--r-sm);outline:none;font-family:inherit}
.auth-msg{font-size:12px;margin-top:8px;text-align:center;min-height:18px}
.auth-msg.err{color:var(--danger)} .auth-msg.ok{color:var(--success)}

/* HEADER */
.header{padding:1rem 1.25rem .75rem;background:var(--bg);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:18px;font-weight:800;letter-spacing:-.5px}
.header-sub{font-size:11px;color:var(--text2);margin-top:1px}
.hbtn{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:0.5px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* TABS */
.tabs{display:flex;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.04em;text-transform:uppercase}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-icon{font-size:17px;display:block;margin-bottom:2px}

/* SECTIONS */
.section{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.section.active{display:block}

/* SEARCH BAR */
.search-bar{padding:.75rem 1rem;background:var(--bg);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:10}
.search-input{width:100%;background:var(--bg3);border:0.5px solid var(--border);color:var(--text);font-size:14px;padding:9px 12px 9px 36px;border-radius:99px;outline:none;font-family:inherit}
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}

/* CLUBS LIST */
.clubs-list{padding:.5rem 1rem 2rem}
.league-section{margin-bottom:1.5rem}
.league-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:.75rem 0 .5rem;border-bottom:0.5px solid var(--border)}
.club-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:0.5px solid var(--border);cursor:pointer;transition:opacity .1s}
.club-item:active{opacity:.6}
.club-shield{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.club-info{flex:1;min-width:0}
.club-name{font-size:14px;font-weight:600}
.club-meta{font-size:11px;color:var(--text2);margin-top:2px}
.club-count{font-size:11px;color:var(--text3);background:var(--bg3);padding:3px 8px;border-radius:99px;flex-shrink:0}
.club-owned{font-size:11px;color:var(--success);background:rgba(34,197,94,.1);padding:3px 8px;border-radius:99px;flex-shrink:0;font-weight:600}

/* CLUB DETAIL */
#clubDetail{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;flex-direction:column;max-width:480px;margin:0 auto}
#clubDetail.open{display:flex}
.detail-header{padding:1rem 1.25rem;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg)}
.back-btn{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:0.5px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detail-club-name{font-size:16px;font-weight:700}
.detail-club-meta{font-size:11px;color:var(--text2)}
.detail-filters{display:flex;gap:6px;padding:.75rem 1rem;overflow-x:auto;flex-shrink:0;border-bottom:0.5px solid var(--border)}
.detail-filters::-webkit-scrollbar{display:none}
.filter-chip{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;white-space:nowrap}
.filter-chip.active{background:var(--accent);color:#0a0a0a;border-color:transparent}
.shirts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:1rem;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shirt-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative}
.shirt-card.owned-card{border-color:rgba(232,255,87,.3)}
.shirt-card:active{opacity:.7}
.shirt-vis{height:130px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.shirt-emoji{font-size:56px;line-height:1}
.shirt-year-tag{position:absolute;top:6px;left:6px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;letter-spacing:.03em}
.shirt-type-tag{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px}
.type-jogo{background:rgba(29,78,216,.75);color:#bfdbfe}
.type-treino{background:rgba(21,128,61,.75);color:#bbf7d0}
.type-viagem{background:rgba(146,64,14,.75);color:#fde68a}
.type-goleiro{background:rgba(107,33,168,.75);color:#e9d5ff}
.type-especial{background:rgba(159,18,57,.75);color:#fecdd3}
.type-terceira{background:rgba(15,118,110,.75);color:#99f6e4}
.owned-badge{position:absolute;bottom:6px;right:6px;font-size:16px}
.shirt-body{padding:8px 10px 10px;border-top:0.5px solid var(--border)}
.shirt-brand{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.shirt-desc{font-size:12px;font-weight:600;color:var(--text);margin-top:2px;line-height:1.3}
.shirt-detail-small{font-size:10px;color:var(--text3);margin-top:3px}

/* SHIRT MODAL */
#shirtModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-end;justify-content:center;padding:0}
#shirtModal.open{display:flex}
.shirt-modal-box{background:var(--bg2);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:0 0 2rem}
.modal-drag{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto}
.shirt-modal-vis{height:220px;display:flex;align-items:center;justify-content:center;font-size:96px;position:relative}
.shirt-modal-body{padding:0 1.25rem}
.shirt-modal-title{font-size:20px;font-weight:800;margin-bottom:4px}
.shirt-modal-meta{font-size:13px;color:var(--text2);margin-bottom:1rem;line-height:1.6}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)}
.info-label{font-size:12px;color:var(--text2)}
.info-value{font-size:12px;font-weight:600;text-align:right;max-width:60%}
.modal-actions{padding:1.25rem 1.25rem 0;display:flex;flex-direction:column;gap:8px}

/* USER PHOTO */
.user-photo-section{margin-top:1rem;padding:1rem;background:var(--bg3);border-radius:var(--r-sm);border:0.5px solid var(--border)}
.user-photo-section h4{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
.photo-upload-zone{border:1.5px dashed var(--border2);border-radius:var(--r-sm);padding:1.5rem;text-align:center;cursor:pointer;position:relative}
.photo-upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-preview{width:100%;border-radius:var(--r-sm);display:block;max-height:200px;object-fit:cover}
.photo-remove{width:100%;margin-top:8px;background:rgba(239,68,68,.1);border:0.5px solid rgba(239,68,68,.3);color:var(--danger);font-size:12px;font-weight:600;padding:8px;border-radius:var(--r-sm);cursor:pointer}

/* MY COLLECTION */
.col-stats{display:flex;gap:0;background:var(--bg2);border-bottom:0.5px solid var(--border)}
.col-stat{flex:1;padding:.6rem .5rem;text-align:center;border-right:0.5px solid var(--border)}
.col-stat:last-child{border-right:none}
.col-stat-num{font-size:20px;font-weight:800;color:var(--accent);display:block}
.col-stat-label{font-size:10px;color:var(--text2);display:block;margin-top:1px}
.col-filters{display:flex;gap:6px;padding:.75rem 1rem;overflow-x:auto;border-bottom:0.5px solid var(--border)}
.col-filters::-webkit-scrollbar{display:none}
.col-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:1rem}
.my-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative}
.my-card:active{opacity:.7}
.my-card-vis{height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.my-card-vis img{width:100%;height:100%;object-fit:cover}
.my-card-vis .no-photo{font-size:52px}
.my-card-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:8px 8px 6px}
.my-card-team{font-size:12px;font-weight:700;color:#fff}
.my-card-body{padding:8px 10px 10px;border-top:0.5px solid var(--border)}
.my-card-title{font-size:12px;font-weight:600}
.my-card-meta{font-size:10px;color:var(--text2);margin-top:2px}
.my-card-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.empty-col{text-align:center;padding:3rem 2rem;color:var(--text2)}
.empty-col span{font-size:48px;display:block;margin-bottom:1rem}

/* BUTTONS */
.btn{height:42px;padding:0 18px;font-size:14px;font-weight:700;border-radius:var(--r-sm);border:0.5px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;width:100%}
.btn:active{opacity:.7}
.btn.primary{background:var(--accent);color:#0a0a0a;border-color:transparent}
.btn.danger-btn{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--danger)}
.btn.sm{height:34px;font-size:12px}
.btn.outline{background:transparent;border-color:var(--border2);color:var(--text)}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0a0a0a;padding:.55rem 1.25rem;border-radius:99px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--text2);font-size:13px;gap:8px}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div style="font-size:48px;margin-bottom:.5rem">👕</div>
  <h1>Camisas BR</h1>
  <p>30 anos de futebol brasileiro<br>na palma da sua mão</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuth('login')">Entrar</div>
      <div class="auth-tab" onclick="switchAuth('signup')">Criar conta</div>
    </div>
    <div id="authForm">
      <div class="auth-field"><label>E-mail</label><input type="email" id="authEmail" placeholder="seu@email.com" autocomplete="email"></div>
      <div class="auth-field"><label>Senha</label><input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password"></div>
      <div id="authName" class="auth-field" style="display:none"><label>Nome</label><input type="text" id="authNameInput" placeholder="Seu nome"></div>
    </div>
    <button class="btn primary" id="authBtn" onclick="doAuth()" style="margin-top:.25rem">Entrar</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <div class="header">
    <div>
      <h1>👕 Camisas BR</h1>
      <div class="header-sub" id="headerSub">Carregando...</div>
    </div>
    <button class="hbtn" onclick="doSignOut()" title="Sair">⏻</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('clubs')"><span class="tab-icon">🏟</span>Clubes</div>
    <div class="tab" onclick="switchTab('collection')"><span class="tab-icon">🗂</span>Minha Coleção</div>
  </div>

  <!-- CLUBS TAB -->
  <div class="section active" id="tab-clubs">
    <div class="search-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" placeholder="Buscar clube..." id="clubSearch" oninput="renderClubs()">
      </div>
    </div>
    <div class="clubs-list" id="clubsList"></div>
  </div>

  <!-- COLLECTION TAB -->
  <div class="section" id="tab-collection">
    <div class="col-stats" id="colStats">
      <div class="col-stat"><span class="col-stat-num">0</span><span class="col-stat-label">Camisas</span></div>
      <div class="col-stat"><span class="col-stat-num">0</span><span class="col-stat-label">Times</span></div>
      <div class="col-stat"><span class="col-stat-num">0</span><span class="col-stat-label">Marcas</span></div>
    </div>
    <div class="col-filters" id="colFilters">
      <div class="filter-chip active" onclick="filterCollection('')" data-filter="">Todas</div>
      <div class="filter-chip" onclick="filterCollection('Jogo')" data-filter="Jogo">Jogo</div>
      <div class="filter-chip" onclick="filterCollection('Treino')" data-filter="Treino">Treino</div>
      <div class="filter-chip" onclick="filterCollection('Goleiro')" data-filter="Goleiro">Goleiro</div>
      <div class="filter-chip" onclick="filterCollection('Terceira')" data-filter="Terceira">Terceira</div>
      <div class="filter-chip" onclick="filterCollection('Especial')" data-filter="Especial">Especial</div>
    </div>
    <div class="col-grid" id="colGrid"></div>
  </div>
</div>

<!-- CLUB DETAIL -->
<div id="clubDetail">
  <div class="detail-header">
    <button class="back-btn" onclick="closeClubDetail()">‹</button>
    <div id="detailShield" style="width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0"></div>
    <div>
      <div class="detail-club-name" id="detailClubName"></div>
      <div class="detail-club-meta" id="detailClubMeta"></div>
    </div>
  </div>
  <div class="detail-filters" id="detailFilters"></div>
  <div class="shirts-grid" id="shirtsGrid"></div>
</div>

<!-- SHIRT MODAL -->
<div id="shirtModal" onclick="closeShirtModal(event)">
  <div class="shirt-modal-box" id="shirtModalBox">
    <div class="modal-drag"></div>
    <div class="shirt-modal-vis" id="modalVis"></div>
    <div class="shirt-modal-body">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:.25rem">
        <div class="shirt-modal-title" id="modalTitle"></div>
        <div id="modalTypeBadge"></div>
      </div>
      <div class="shirt-modal-meta" id="modalMeta"></div>
      <div id="modalInfoRows"></div>
      <div class="modal-actions">
        <div id="modalActionBtn"></div>
        <div class="user-photo-section" id="userPhotoSection" style="display:none">
          <h4>Sua foto desta camisa</h4>
          <div id="photoArea"></div>
          <div id="savePhotoBtn" style="margin-top:8px;display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentUser = null;
let userCollection = [];
let currentClub = null;
let currentShirt = null;
let currentDetailFilter = '';
let colFilter = '';
let authMode = 'login';

// ── AUTH ──────────────────────────────────────────────────────────────────────
function switchAuth(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',['login','signup'][i]===mode));
  document.getElementById('authName').style.display = mode==='signup'?'block':'none';
  document.getElementById('authBtn').textContent = mode==='login'?'Entrar':'Criar conta';
  document.getElementById('authMsg').textContent = '';
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  const msg = document.getElementById('authMsg');
  if(!email||!pass){msg.textContent='Preencha todos os campos';msg.className='auth-msg err';return;}
  msg.textContent = authMode==='login'?'Entrando...':'Criando conta...';
  msg.className = 'auth-msg';
  try {
    let res;
    if(authMode==='login'){
      res = await sb.auth.signInWithPassword({email,password:pass});
    } else {
      const name = document.getElementById('authNameInput').value.trim();
      res = await sb.auth.signUp({email,password:pass,options:{data:{name}}});
    }
    if(res.error) throw res.error;
    if(authMode==='signup') {
      msg.textContent='Conta criada! Verifique seu e-mail para confirmar.';
      msg.className='auth-msg ok';
    }
  } catch(e) {
    msg.textContent = e.message==='Invalid login credentials'?'E-mail ou senha incorretos':e.message;
    msg.className='auth-msg err';
  }
}

async function doSignOut() {
  if(!confirm('Sair da conta?')) return;
  await sb.auth.signOut();
}

sb.auth.onAuthStateChange(async(event, session)=>{
  if(session?.user){
    currentUser = session.user;
    document.getElementById('authScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('headerSub').textContent = currentUser.user_metadata?.name || currentUser.email;
    await loadCollection();
    renderClubs();
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

// ── SUPABASE DATA ─────────────────────────────────────────────────────────────
async function loadCollection() {
  if(!currentUser) return;
  const {data} = await sb.from('collection').select('*').eq('user_id', currentUser.id);
  userCollection = data || [];
  renderCollection();
}

function isOwned(shirtId) { return userCollection.some(s=>s.shirt_id===shirtId); }
function getOwned(shirtId) { return userCollection.find(s=>s.shirt_id===shirtId); }

async function addToCollection(shirtId, clubId) {
  if(!currentUser) return;
  if(isOwned(shirtId)) { showToast('Já está na sua coleção!'); return; }
  const {data,error} = await sb.from('collection').insert({
    user_id: currentUser.id, shirt_id: shirtId, club_id: clubId, added_at: new Date().toISOString()
  }).select().single();
  if(error){showToast('Erro ao adicionar');return;}
  userCollection.push(data);
  showToast('✓ Adicionada à coleção!');
  renderCollection();
  renderShirtsGrid();
  updateModalAction();
}

async function removeFromCollection(shirtId) {
  if(!confirm('Remover da coleção?')) return;
  const item = getOwned(shirtId);
  if(!item) return;
  if(item.photo_url) {
    const path = item.photo_url.split('/').pop();
    await sb.storage.from('shirt-photos').remove([`${currentUser.id}/${path}`]);
  }
  await sb.from('collection').delete().eq('id', item.id);
  userCollection = userCollection.filter(s=>s.shirt_id!==shirtId);
  showToast('Removida da coleção');
  renderCollection();
  renderShirtsGrid();
  updateModalAction();
}

async function uploadPhoto(file, shirtId) {
  if(!currentUser) return null;
  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}/${shirtId}-${Date.now()}.${ext}`;
  const {error} = await sb.storage.from('shirt-photos').upload(path, file, {upsert:true});
  if(error) return null;
  const {data} = sb.storage.from('shirt-photos').getPublicUrl(path);
  return data.publicUrl;
}

async function savePhoto(shirtId, file) {
  const btn = document.getElementById('savePhotoBtn');
  btn.innerHTML = '<button class="btn primary sm" disabled>Salvando...</button>';
  const url = await uploadPhoto(file, shirtId);
  if(!url){showToast('Erro ao salvar foto');return;}
  const item = getOwned(shirtId);
  if(!item) return;
  await sb.from('collection').update({photo_url:url}).eq('id',item.id);
  item.photo_url = url;
  showToast('✓ Foto salva!');
  renderCollection();
  renderPhotoArea(shirtId);
}

// ── CLUBS ─────────────────────────────────────────────────────────────────────
function renderClubs() {
  const q = document.getElementById('clubSearch').value.toLowerCase();
  const filtered = CLUBS_DB.filter(c=>!q||c.name.toLowerCase().includes(q)||c.state.toLowerCase().includes(q));
  const byLeague = {};
  filtered.forEach(c=>{const k=`${c.league} — ${c.state}`;if(!byLeague[k])byLeague[k]=[];byLeague[k].push(c);});
  const ownedClubs = new Set(userCollection.map(s=>s.club_id));
  document.getElementById('clubsList').innerHTML = Object.entries(byLeague).map(([league,clubs])=>`
    <div class="league-section">
      <div class="league-title">${league}</div>
      ${clubs.map(c=>{
        const owned = userCollection.filter(s=>s.club_id===c.id).length;
        const total = c.shirts.length;
        return `<div class="club-item" onclick="openClubDetail('${c.id}')">
          <div class="club-shield" style="background:${c.color}">${c.emoji}</div>
          <div class="club-info">
            <div class="club-name">${c.name}</div>
            <div class="club-meta">${total} camisas · ${c.state}</div>
          </div>
          ${owned>0?`<div class="club-owned">${owned}/${total} ✓</div>`:`<div class="club-count">${total}</div>`}
        </div>`;
      }).join('')}
    </div>`).join('');
}

// ── CLUB DETAIL ───────────────────────────────────────────────────────────────
function openClubDetail(clubId) {
  currentClub = CLUBS_DB.find(c=>c.id===clubId);
  if(!currentClub) return;
  currentDetailFilter = '';
  document.getElementById('detailShield').style.background = currentClub.color;
  document.getElementById('detailShield').textContent = currentClub.emoji;
  document.getElementById('detailClubName').textContent = currentClub.name;
  const owned = userCollection.filter(s=>s.club_id===clubId).length;
  document.getElementById('detailClubMeta').textContent = `${currentClub.shirts.length} camisas · ${owned} na sua coleção`;
  // filters
  const types = ['Todas',...new Set(currentClub.shirts.map(s=>s.type))];
  const years = [...new Set(currentClub.shirts.map(s=>s.year))].sort((a,b)=>b-a);
  document.getElementById('detailFilters').innerHTML =
    types.map(t=>`<div class="filter-chip${t==='Todas'?' active':''}" onclick="setDetailFilter('${t==='Todas'?'':t}')">${t}</div>`).join('')+
    `<div style="width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 2px"></div>`+
    years.map(y=>`<div class="filter-chip" onclick="setDetailFilter('${y}')">${y}</div>`).join('');
  renderShirtsGrid();
  document.getElementById('clubDetail').classList.add('open');
}

function closeClubDetail() { document.getElementById('clubDetail').classList.remove('open'); }

function setDetailFilter(val) {
  currentDetailFilter = val;
  document.querySelectorAll('#detailFilters .filter-chip').forEach(c=>{
    const cv = c.textContent==='Todas'?'':c.textContent;
    c.classList.toggle('active', cv===val||(val===''&&c.textContent==='Todas'));
  });
  renderShirtsGrid();
}

function renderShirtsGrid() {
  if(!currentClub) return;
  let shirts = currentClub.shirts;
  if(currentDetailFilter) {
    shirts = shirts.filter(s=>String(s.type)===String(currentDetailFilter)||String(s.year)===String(currentDetailFilter));
  }
  shirts = [...shirts].sort((a,b)=>b.year-a.year);
  const typeClass = {Jogo:'type-jogo',Treino:'type-treino',Viagem:'type-viagem',Goleiro:'type-goleiro',Especial:'type-especial',Terceira:'type-terceira'};
  document.getElementById('shirtsGrid').innerHTML = shirts.map(s=>{
    const owned = isOwned(s.id);
    return `<div class="shirt-card${owned?' owned-card':''}" onclick="openShirt('${s.id}')">
      <div class="shirt-vis" style="background:${s.cor}">
        <span class="shirt-emoji">👕</span>
        <span class="shirt-year-tag">${s.year}</span>
        <span class="shirt-type-tag ${typeClass[s.type]||'type-jogo'}">${s.type}</span>
        ${owned?'<span class="owned-badge">✓</span>':''}
      </div>
      <div class="shirt-body">
        <div class="shirt-brand">${s.brand}</div>
        <div class="shirt-desc">${s.desc}</div>
        <div class="shirt-detail-small">${s.detail}</div>
      </div>
    </div>`;
  }).join('');
}

// ── SHIRT MODAL ───────────────────────────────────────────────────────────────
function openShirt(shirtId) {
  const club = CLUBS_DB.find(c=>c.shirts.some(s=>s.id===shirtId));
  if(!club) return;
  const shirt = club.shirts.find(s=>s.id===shirtId);
  if(!shirt) return;
  currentShirt = shirt;
  currentClub = club;
  const typeClass = {Jogo:'type-jogo',Treino:'type-treino',Goleiro:'type-goleiro',Especial:'type-especial',Terceira:'type-terceira',Viagem:'type-viagem'};
  document.getElementById('modalVis').style.background = shirt.cor;
  document.getElementById('modalVis').innerHTML = `<span style="font-size:96px">👕</span>`;
  document.getElementById('modalTitle').textContent = `${club.name} ${shirt.year}`;
  document.getElementById('modalTypeBadge').innerHTML = `<span class="shirt-type-tag ${typeClass[shirt.type]||'type-jogo'}" style="position:static">${shirt.type}</span>`;
  document.getElementById('modalMeta').textContent = shirt.detail;
  document.getElementById('modalInfoRows').innerHTML = [
    ['Marca',shirt.brand],['Tipo',shirt.type],['Temporada',shirt.year],
    ['Clube',club.name],['Estado',club.state],['Liga',club.league]
  ].map(([l,v])=>`<div class="info-row"><span class="info-label">${l}</span><span class="info-value">${v}</span></div>`).join('');
  updateModalAction();
  document.getElementById('shirtModal').classList.add('open');
}

function updateModalAction() {
  if(!currentShirt) return;
  const owned = isOwned(currentShirt.id);
  document.getElementById('modalActionBtn').innerHTML = owned
    ? `<button class="btn danger-btn" onclick="removeFromCollection('${currentShirt.id}')">Remover da coleção</button>`
    : `<button class="btn primary" onclick="addToCollection('${currentShirt.id}','${currentClub?.id||''}')">+ Tenho esta camisa</button>`;
  const photoSection = document.getElementById('userPhotoSection');
  photoSection.style.display = owned ? 'block' : 'none';
  if(owned) renderPhotoArea(currentShirt.id);
}

function renderPhotoArea(shirtId) {
  const item = getOwned(shirtId);
  const area = document.getElementById('photoArea');
  const saveBtn = document.getElementById('savePhotoBtn');
  if(item?.photo_url) {
    area.innerHTML = `<img src="${item.photo_url}" class="photo-preview">`;
    saveBtn.innerHTML = `<button class="photo-remove" onclick="removePhoto('${shirtId}')">✕ Remover foto</button>`;
    saveBtn.style.display='block';
  } else {
    area.innerHTML = `<div class="photo-upload-zone">
      <input type="file" accept="image/*" capture="environment" onchange="handlePhotoUpload(event,'${shirtId}')">
      <div style="font-size:28px;margin-bottom:8px">📷</div>
      <div style="font-size:13px;font-weight:600">Fotografar minha camisa</div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px">Tire uma foto ou escolha da galeria</div>
    </div>`;
    saveBtn.style.display='none';
  }
}

let pendingPhotoFile = null;
let pendingPhotoShirtId = null;

function handlePhotoUpload(e, shirtId) {
  const file = e.target.files[0]; if(!file) return;
  pendingPhotoFile = file;
  pendingPhotoShirtId = shirtId;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('photoArea').innerHTML = `<img src="${ev.target.result}" class="photo-preview">`;
    document.getElementById('savePhotoBtn').innerHTML = `<button class="btn primary sm" onclick="confirmSavePhoto()">💾 Salvar foto</button>`;
    document.getElementById('savePhotoBtn').style.display='block';
  };
  reader.readAsDataURL(file);
}

async function confirmSavePhoto() {
  if(!pendingPhotoFile||!pendingPhotoShirtId) return;
  await savePhoto(pendingPhotoShirtId, pendingPhotoFile);
  pendingPhotoFile = null;
}

async function removePhoto(shirtId) {
  if(!confirm('Remover a foto?')) return;
  const item = getOwned(shirtId);
  if(!item||!item.photo_url) return;
  const path = item.photo_url.split('/').slice(-2).join('/');
  await sb.storage.from('shirt-photos').remove([path]);
  await sb.from('collection').update({photo_url:null}).eq('id',item.id);
  item.photo_url = null;
  renderPhotoArea(shirtId);
  renderCollection();
  showToast('Foto removida');
}

function closeShirtModal(e) {
  if(e.target===document.getElementById('shirtModal')) {
    document.getElementById('shirtModal').classList.remove('open');
  }
}

// ── COLLECTION ────────────────────────────────────────────────────────────────
function filterCollection(type) {
  colFilter = type;
  document.querySelectorAll('#colFilters .filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.filter===type));
  renderCollection();
}

function renderCollection() {
  let items = userCollection;
  if(colFilter) {
    items = items.filter(s=>{
      const club = CLUBS_DB.find(c=>c.id===s.club_id);
      const shirt = club?.shirts.find(sh=>sh.id===s.shirt_id);
      return shirt?.type===colFilter;
    });
  }
  // stats
  const teams = new Set(userCollection.map(s=>s.club_id));
  const brands = new Set(userCollection.map(s=>{
    const club=CLUBS_DB.find(c=>c.id===s.club_id);
    return club?.shirts.find(sh=>sh.id===s.shirt_id)?.brand;
  }).filter(Boolean));
  document.getElementById('colStats').innerHTML = [
    [userCollection.length,'Camisas'],[teams.size,'Times'],[brands.size,'Marcas']
  ].map(([n,l])=>`<div class="col-stat"><span class="col-stat-num">${n}</span><span class="col-stat-label">${l}</span></div>`).join('');

  const grid = document.getElementById('colGrid');
  if(!items.length) {
    grid.innerHTML = `<div class="empty-col" style="grid-column:1/-1">
      <span>${userCollection.length?'🔍':'👕'}</span>
      <p>${userCollection.length?'Nenhuma camisa neste filtro':'Sua coleção está vazia.<br>Explore os clubes e marque as camisas que você tem!'}</p>
    </div>`;
    return;
  }
  grid.innerHTML = items.map(s=>{
    const club = CLUBS_DB.find(c=>c.id===s.club_id);
    const shirt = club?.shirts.find(sh=>sh.id===s.shirt_id);
    if(!shirt||!club) return '';
    return `<div class="my-card" onclick="openShirtFromCollection('${s.shirt_id}')">
      <div class="my-card-vis" style="background:${shirt.cor}">
        ${s.photo_url?`<img src="${s.photo_url}" alt="${shirt.desc}">`:`<div class="no-photo">👕</div>`}
        <div class="my-card-overlay"><div class="my-card-team">${club.name}</div></div>
        <button class="my-card-del" onclick="event.stopPropagation();removeFromCollection('${s.shirt_id}')">×</button>
      </div>
      <div class="my-card-body">
        <div class="my-card-title">${shirt.desc}</div>
        <div class="my-card-meta">${shirt.brand} · ${shirt.year} · ${shirt.type}</div>
      </div>
    </div>`;
  }).join('');
}

function openShirtFromCollection(shirtId) {
  const club = CLUBS_DB.find(c=>c.shirts.some(s=>s.id===shirtId));
  if(club) { currentClub=club; openShirt(shirtId); }
}

  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+id));
  if(id==='collection') renderCollection();

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
